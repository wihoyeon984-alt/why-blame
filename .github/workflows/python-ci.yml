name: Python CI

on:
  push:
    branches:
      - main
      - claim-recovery-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.8"
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Show environment
        run: |
          python --version
          python -m pip --version
          git --version

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e .

      - name: Compile project modules
        run: |
          python -m compileall -q .

      - name: Verify installed CLI outside repository
        run: |
          python -c "import subprocess, tempfile; result = subprocess.run(['why-blame', '--help'], cwd=tempfile.gettempdir(), check=False); raise SystemExit(result.returncode)"

      - name: Run unit tests
        env:
          PYTHONWARNINGS: default
        run: |
          python -m unittest

      - name: Verify working tree remains clean
        shell: bash
        run: |
          git diff --exit-code
