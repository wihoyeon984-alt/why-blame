[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "why-blame"
version = "0.2.4"
description = "Git blame tells you who. Why-blame tells you why."
authors = [
    { name = "Wi Ho-yeon" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
why-blame = "main:main"

[tool.setuptools]
py-modules = ["main", "git_tracker", "github_client", "timeline", "viewer", "narrative", "consistency"]