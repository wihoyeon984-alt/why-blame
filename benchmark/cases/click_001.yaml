evidence:
  commit:
    available: true
    message: "Fix race condition on `KeyboardInterrupt` arriving in `Command.main()`"
    body: "Closes #3802"

  diff:
    available: true
    summary: >
      Command.main collects the report callback and intended exit code
      before final reporting and exit handling. Late interrupts are
      handled without allowing them to replace the already determined
      exit result.

  pull_requests:
    - number: 3818
      url: "https://github.com/pallets/click/pull/3818"
      available: true
      role: "bugfix"

  issues:
    - number: 3802
      url: "https://github.com/pallets/click/issues/3802"
      available: true
      role: "bug_report"

  changelog:
    available: true
    summary: >
      A KeyboardInterrupt arriving while Command.main reports an abort
      or error, or while it exits, no longer escapes as an unhandled
      traceback. The intended exit code is preserved.

ground_truth:
  supported_claims:
    - id: "claim_001"
      claim: >
        A late KeyboardInterrupt during Command.main error, abort, or
        exit handling should not escape as an unhandled traceback.
      evidence:
        - "Issue #3802"
        - "commit fc518e41218b447e875fe27244ae692c269bcb77"
        - "CHANGES.md"

    - id: "claim_002"
      claim: >
        Once Command.main has determined the intended exit code,
        a late KeyboardInterrupt should not replace that exit result.
      evidence:
        - "diff in src/click/core.py"
        - "CHANGES.md"
        - "commit fc518e41218b447e875fe27244ae692c269bcb77"

  unsupported_claims:
    - id: "claim_003"
      claim: "The change was primarily made to improve performance."

    - id: "claim_004"
      claim: "The change fixes a security vulnerability."

    - id: "claim_005"
      claim: "The change fixes a Windows-only problem."

    - id: "claim_006"
      claim: "The change makes Click ignore every KeyboardInterrupt."

  ambiguous_claims:
    - id: "claim_007"
      claim: >
        Why this exact restructuring of Command.main was selected over
        every other possible implementation.

