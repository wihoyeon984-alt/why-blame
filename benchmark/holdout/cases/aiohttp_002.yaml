ground_truth:
  frozen: true
  frozen_before_system_run: true

  claims:

    - id: claim_001
      type: BEHAVIOR
      label: SUPPORTED

      text: >
        resume_reading() records whether reading was paused before
        calling the parent resume_reading() implementation.

      semantics:
        action: "CAPTURE"
        subject: "reading paused state"
        target: "was_paused"
        condition: ""
        scope: "ResponseHandler.resume_reading"

      field_entailment:
        action: DIRECT
        subject: DIRECT
        target: DIRECT
        condition: NONE
        scope: DIRECT

      evidence:
        - channel: DIFF
          ref: "5c293f4f71f6188b446afd331afa47262a874f4f"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            The target assigns self._reading_paused to was_paused
            immediately before calling super().resume_reading().

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        This is directly observable from the target diff and does not
        require an inference about why the state is stored.

    - id: claim_002
      type: BEHAVIOR
      label: SUPPORTED

      text: >
        The read timeout is rescheduled only when reading had been
        paused before resume_reading() was called.

      semantics:
        action: "RESCHEDULE"
        subject: "read timeout"
        target: ""
        condition: "reading was previously paused"
        scope: "ResponseHandler.resume_reading"

      field_entailment:
        action: DIRECT
        subject: DIRECT
        target: NONE
        condition: DIRECT
        scope: DIRECT

      evidence:
        - channel: DIFF
          ref: "5c293f4f71f6188b446afd331afa47262a874f4f"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            _reschedule_timeout() is now guarded by if was_paused,
            where was_paused captures self._reading_paused before the
            parent resume_reading() call.

        - channel: COMMIT
          ref: "5c293f4f71f6188b446afd331afa47262a874f4f"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: PARTIAL
          note: >
            The commit identifies the change as a read-timeout fix for
            a connection returned to the pool.

        - channel: PR
          ref: "#12954"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: PARTIAL
          note: >
            The implementation commit is explicitly associated with
            pull request #12954.

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        The conditional rescheduling behavior is directly established
        by the diff. Commit and PR context are supplementary rather
        than necessary for the behavior itself.

    - id: claim_003
      type: CAUSE
      label: SUPPORTED

      text: >
        The change prevents a pooled idle connection from retaining a
        re-armed read timeout that could fire before the connection is
        reused and make the next request fail immediately.

      semantics:
        action: "PREVENT"
        subject: "pending read timeout on an idle pooled connection"
        target: "failure of the next request"
        condition: "connection has been returned to the pool"
        scope: "client connection reuse"

      field_entailment:
        action: DIRECT
        subject: DIRECT
        target: DIRECT
        condition: DIRECT
        scope: DIRECT

      evidence:
        - channel: HISTORY
          ref: "aiohttp 3.14.2 changelog"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            The project changelog explicitly states that a read timeout
            could be re-armed after a keep-alive connection was
            returned to the pool, remain pending, and cause the next
            request reusing that connection to fail immediately with
            SocketTimeoutError.

        - channel: COMMIT
          ref: "5c293f4f71f6188b446afd331afa47262a874f4f"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: PARTIAL
          note: >
            The commit explicitly identifies a read-timeout problem on
            a connection returned to the pool.

        - channel: DIFF
          ref: "5c293f4f71f6188b446afd331afa47262a874f4f"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: PARTIAL
          note: >
            The actual implementation limits timeout rescheduling to
            the previously-paused case.

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        The failure mechanism is not established by the target diff
        alone. It is supported by the project's explicit changelog
        explanation together with the matching implementation and
        commit context.

    - id: claim_004
      type: CAUSE
      label: UNSUPPORTED

      text: >
        The change was primarily introduced to improve request
        performance.

      semantics:
        action: ""
        subject: ""
        target: ""
        condition: ""
        scope: ""

      field_entailment:
        action: NONE
        subject: NONE
        target: NONE
        condition: NONE
        scope: NONE

      evidence: []

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        The frozen evidence describes timeout correctness and
        connection reuse failure behavior, not a performance
        optimization as the reason for the change.

