selection:
  selected_before_system_run: true
  previously_used_for_development: false
  notes: >
    Holdout candidate selected from public Git history before running
    why-blame. The target changes schema alteration behavior for
    backends that support changing column comments independently of
    column types. Parent commit:
    9cb2cba6fc7f71ed768aed8cbc32e7447ecb0be8.

