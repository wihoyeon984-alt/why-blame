  claims:

    - id: claim_001
      type: BEHAVIOR
      label: SUPPORTED

      text: >
        If socket setup raises an exception, sockets accumulated so far
        are closed before the exception is re-raised.

      semantics:
        action: "CLOSE"
        subject: "sockets accumulated so far"
        target: ""
        condition: "socket setup raises an exception"
        scope: "dummy Hypercorn server socket setup"

      field_entailment:
        action: DIRECT
        subject: DIRECT
        target: NONE
        condition: DIRECT
        scope: DIRECT

      evidence:
        - channel: DIFF
          ref: "09217b75d51f3c74d089b587f1be813b6bdfc7d7"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            The added except BaseException block iterates over sockets,
            calls sock.close() for each one, and then re-raises the
            exception.

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        The cleanup and re-raise behavior is directly observable from
        the target diff and does not require external causal evidence.

    - id: claim_002
      type: BEHAVIOR
      label: SUPPORTED

      text: >
        A newly created socket is added to the cleanup collection before
        bind() is attempted, allowing that socket to be included in
        exception cleanup if binding fails.

      semantics:
        action: "ADD"
        subject: "newly created socket"
        target: "socket cleanup collection"
        condition: "before bind is attempted"
        scope: "dummy Hypercorn server socket setup"

      field_entailment:
        action: DIRECT
        subject: DIRECT
        target: DIRECT
        condition: DIRECT
        scope: DIRECT

      evidence:
        - channel: DIFF
          ref: "09217b75d51f3c74d089b587f1be813b6bdfc7d7"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            sockets.append(sock) was moved directly after socket
            creation and occurs before sock.bind(). The exception
            handler later closes every socket in this collection.

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        This structural ordering is directly established by the diff.
        It explains why a socket whose bind operation fails can already
        be part of the cleanup collection.

    - id: claim_003
      type: CAUSE
      label: SUPPORTED

      text: >
        The explicit cleanup is performed because the caller may retry
        after EADDRINUSE, so sockets created before the failed attempt
        should be closed instead of being left to garbage collection.

      semantics:
        action: "CLOSE"
        subject: "sockets created before the failed attempt"
        target: "explicit cleanup before retry"
        condition: "the caller retries on EADDRINUSE"
        scope: "dummy Hypercorn server socket setup"

      field_entailment:
        action: DIRECT
        subject: DIRECT
        target: DIRECT
        condition: DIRECT
        scope: DIRECT

      evidence:
        - channel: DIFF
          ref: "09217b75d51f3c74d089b587f1be813b6bdfc7d7"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            The source comment explicitly states that the caller retries
            on EADDRINUSE and that sockets created so far are closed
            rather than left to the garbage collector.

        - channel: COMMIT
          ref: "09217b75d51f3c74d089b587f1be813b6bdfc7d7"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            The commit message explicitly states that dummyserver
            sockets are closed when bind fails before retrying.

        - channel: PR
          ref: "#5262"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: PARTIAL
          note: >
            The implementation commit is explicitly associated with
            pull request #5262.

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        Unlike the basic cleanup behavior, the retry and garbage
        collection rationale is explicitly documented by the source
        comment and commit message.

