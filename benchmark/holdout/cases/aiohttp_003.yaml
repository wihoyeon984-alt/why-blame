    - id: claim_001
      type: BEHAVIOR
      label: SUPPORTED

      text: >
        ClientSession passes the negotiated WebSocket compression state
        explicitly to WebSocketReader.

      semantics:
        action: "PASS"
        subject: "negotiated WebSocket compression state"
        target: "WebSocketReader"
        condition: ""
        scope: "ClientSession WebSocket setup"

      field_entailment:
        action: DIRECT
        subject: DIRECT
        target: DIRECT
        condition: NONE
        scope: DIRECT

      evidence:
        - channel: DIFF
          ref: "dcac82ea3323605097d77ae2dde60d389546a9ba"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            ClientSession constructs WebSocketReader with the explicit
            argument compress=bool(compress).

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        The explicit propagation of the compression state is directly
        visible in the selected production diff.

    - id: claim_002
      type: BEHAVIOR
      label: SUPPORTED

      text: >
        WebSocketReader no longer assumes that compression is enabled
        when its compression state is not explicitly supplied.

      semantics:
        action: "REQUIRE"
        subject: "WebSocket compression state"
        target: "explicit WebSocketReader argument"
        condition: ""
        scope: "WebSocketReader initialization"

      field_entailment:
        action: DIRECT
        subject: DIRECT
        target: DIRECT
        condition: NONE
        scope: DIRECT

      evidence:
        - channel: DIFF
          ref: "dcac82ea3323605097d77ae2dde60d389546a9ba"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            WebSocketReader's compress parameter changes from
            compress: bool = True to compress: bool, removing the
            default-enabled compression assumption.

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        The removal of the True default directly requires callers to
        provide the compression state.

    - id: claim_003
      type: CAUSE
      label: SUPPORTED

      text: >
        The change prevents WebSocket frames from being decompressed
        when permessage-deflate compression was not negotiated.

      semantics:
        action: "AVOID"
        subject: "WebSocket frame decompression"
        target: "frames without negotiated permessage-deflate"
        condition: "permessage-deflate was not negotiated"
        scope: "WebSocket client"

      field_entailment:
        action: DIRECT
        subject: DIRECT
        target: DIRECT
        condition: DIRECT
        scope: DIRECT

      evidence:
        - channel: COMMIT
          ref: "dcac82ea3323605097d77ae2dde60d389546a9ba"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            The commit explicitly states that the change fixes
            decompressing frames without negotiation.

        - channel: HISTORY
          ref: "aiohttp 3.14.2 changelog"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            The project changelog explicitly describes the fix as
            preventing client frame decompression when
            permessage-deflate was not negotiated.

        - channel: DIFF
          ref: "dcac82ea3323605097d77ae2dde60d389546a9ba"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: PARTIAL
          note: >
            The client now passes bool(compress) to WebSocketReader and
            WebSocketReader no longer defaults compression to True.

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        The end-to-end motivation is explicitly documented by the
        commit and project changelog and is consistent with the
        production implementation.

    - id: claim_004
      type: BEHAVIOR
      label: UNSUPPORTED

      text: >
        WebSocket frame decompression is always disabled after this
        change.

      semantics:
        action: "DISABLE"
        subject: "WebSocket frame decompression"
        target: ""
        condition: ""
        scope: "WebSocket client"

      field_entailment:
        action: CONFLICTING
