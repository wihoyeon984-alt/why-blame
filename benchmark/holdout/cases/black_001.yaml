  claims:

    - id: claim_001
      type: BEHAVIOR
      label: SUPPORTED

      text: >
        During _force_standalone_comment_split(), comments associated
        with a leaf are appended to the current output line after that
        leaf.

      semantics:
        action: "APPEND"
        subject: "comments associated with the leaf"
        target: "current output line"
        condition: "the forced standalone-comment split processes the leaf"
        scope: "_force_standalone_comment_split"

      field_entailment:
        action: DIRECT
        subject: DIRECT
        target: DIRECT
        condition: DIRECT
        scope: DIRECT

      evidence:
        - channel: DIFF
          ref: "59f16b5bd9009bec205eee66cc22f4e74a26bea5"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            The added loop calls line.comments_after(leaf) and appends
            each returned comment to current_line using
            preformatted=True.

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        The target diff directly establishes collection and appending
        of comments associated with each processed leaf.

    - id: claim_002
      type: BEHAVIOR
      label: SUPPORTED

      text: >
        Inline comments on lines produced by the forced split are
        preserved instead of being silently dropped.

      semantics:
        action: "PRESERVE"
        subject: "inline comments"
        target: "lines produced by the forced split"
        condition: ""
        scope: "_force_standalone_comment_split"

      field_entailment:
        action: DIRECT
        subject: DIRECT
        target: DIRECT
        condition: NONE
        scope: DIRECT

      evidence:
        - channel: DIFF
          ref: "59f16b5bd9009bec205eee66cc22f4e74a26bea5"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            Comments returned by comments_after(leaf) are explicitly
            appended to the generated line.

        - channel: COMMIT
          ref: "59f16b5bd9009bec205eee66cc22f4e74a26bea5"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            The commit message states that inline comments are kept in
            _force_standalone_comment_split.

        - channel: HISTORY
          ref: "Black CHANGES.md at 59f16b5b"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            The changelog states that inline comments were being
            dropped on lines produced by the forced split and that
            trailing comments, including type-ignore comments, are now
            preserved.

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        Both the implementation and project changelog directly support
        the observable comment-preservation behavior.

