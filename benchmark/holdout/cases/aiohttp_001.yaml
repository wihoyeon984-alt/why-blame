  claims:

    - id: claim_001
      type: BEHAVIOR
      label: SUPPORTED

      text: >
        When Content-Length is present but is not composed only of
        ASCII decimal digits, the multipart body-part reader raises
        ValueError.

      semantics:
        action: "RAISE"
        subject: "multipart Content-Length validation"
        target: "ValueError"
        condition: >
          Content-Length is present and is not composed only of
          ASCII decimal digits
        scope: "BodyPartReader"

      field_entailment:
        action: DIRECT
        subject: DIRECT
        target: DIRECT
        condition: DIRECT
        scope: DIRECT

      evidence:
        - channel: DIFF
          ref: "c67c9e4622d5a30a76e1b7b2e2d255eff6ec6640"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            The added condition checks that length is not None and
            requires both isascii() and isdigit(); otherwise it raises
            ValueError.

        - channel: COMMIT
          ref: "c67c9e4622d5a30a76e1b7b2e2d255eff6ec6640"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: PARTIAL
          note: >
            Commit message states that non-digit Content-Length values
            in multipart body parts are rejected.

        - channel: PR
          ref: "#12794"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: PARTIAL
          note: >
            The implementation commit is explicitly associated with
            pull request #12794.

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        The target diff directly establishes the condition and the
        ValueError behavior. No causal explanation is needed to support
        this behavior claim.

    - id: claim_002
      type: CAUSE
      label: SUPPORTED

      text: >
        The validation was introduced to make multipart Content-Length
        parsing stricter and align it with the main request parser and
        RFC 9110 Section 8.6 requirements.

      semantics:
        action: ""
        subject: "multipart Content-Length validation"
        target: "stricter Content-Length parsing"
        condition: ""
        scope: "multipart body parts"

      field_entailment:
        action: NONE
        subject: DIRECT
        target: DIRECT
        condition: NONE
        scope: DIRECT

      evidence:
        - channel: COMMIT
          ref: "c67c9e4622d5a30a76e1b7b2e2d255eff6ec6640"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: PARTIAL
          note: >
            The commit explicitly describes rejecting non-digit
            Content-Length values.

        - channel: HISTORY
          ref: "aiohttp 3.14.2 changelog"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            The project changelog explicitly describes rejecting
            non-plain-digit Content-Length values to match the
            strictness of the main request parser and RFC 9110
            Section 8.6.

        - channel: DIFF
          ref: "c67c9e4622d5a30a76e1b7b2e2d255eff6ec6640"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: PARTIAL
          note: >
            The added source comment directly references RFC 9110
            Section 8.6.

      contradiction:
        status: NONE
        evidence: []

      rationale: >
        Unlike claim_001, this is contextual rather than merely
        observable behavior. The project changelog and source comment
        provide explicit support for the stricter parsing and RFC
        alignment.

