        target: DIRECT
        condition: DIRECT
        scope: DIRECT

      evidence:
        - channel: DIFF
          ref: "59684b5c270d03f7e87614a6cebeb660cd6340df"
          relation: SUPPORTS
          relevance: HIGH
          sufficiency: HIGH
          note: >
            The selected revision explicitly returns
            b"".join([self._read_nowait_chunk(-1) for _ in range(count)]).

      contradiction:
        status: NONE
