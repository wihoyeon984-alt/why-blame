      type: BEHAVIOR
      label: SUPPORTED

      text: >
        When multiple buffered chunks are read in this path,
        StreamReader passes a list comprehension of the chunks to
        bytes.join().

      semantics:
        action: "JOIN"
        subject: "buffered chunks collected by a list comprehension"
        target: "bytes result"
        condition: "more than one buffered chunk is handled by this path"
        scope: "StreamReader"

      field_entailment:
        action: DIRECT
